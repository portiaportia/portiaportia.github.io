<!DOCTYPE html>
<html>
    <head>
        <title>JavaScript</title>
        <link rel="stylesheet" href="styles.css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
        <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
        
    </head>
    <body>
        <div id="content">
            <header id="main-header">
                <h1>JavaScript</h1>
                
                <nav id="main-nav">
                    <ul class="columns">
                        <li><a href="index.html">Home</a></li>
                        <li><a href="intro.html">Introduction</a></li>
                        <li><a href="loops.html">Loops/Arrays</a></li>
                        <li><a href="classes.html">Classes</a></li>
                        <li><a href="json.html">JSON</a></li>
                        <li><a href="contact.html">Contact Us</a></li>
                    </ul>
                </nav>
            </header>
            <main>
                <h2 id="page-title">Loops & Arrays</h2>
                <div class="projects">
                    <section class="project-card">
                        <h3>Looping</h3>
                        <button id="btn-loop">Loop</button>
                        <div id="loop-result"></div>
                    </section>
                    
                    <section class="project-card">
                        <h3>Loops with Range</h3>
                        <p>
                            <label for="txt-start">Start:</label>
                            <input type="number" id="txt-start" min="0" max="5">
                            <span id="error-start" class="error hidden"></span>
                        </p>
                        <p>
                            <label for="txt-end">End:</label>
                            <input type="number" id="txt-end" min="10" max="20">
                            <span id="error-end" class="error hidden"></span>
                        </p>

                        <p>
                            <button id="btn-loop-range">Loop</button>
                        </p>

                        <ul id="range-list">

                        </ul>
                    </section>
                    <section class="project-card">
                        <h3>Array</h3>
                        <button id="btn-show-toys">Show list</button>
                        <div id="toy-list"></div>
                    </section>
                    <section class="project-card">
                        <h3>Associative Array</h3>
                        <button id="btn-show-toy-prices">Show table</button>
                        <div id="toy-info"></div>
                    </section>
                </div>
            </main>
        </div>
        <script src="scripts/loops.js"></script>
    </body>
</html>
